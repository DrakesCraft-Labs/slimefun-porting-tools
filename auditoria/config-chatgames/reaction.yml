name: reaction
display-name: <red>Reflejos de Hermes</red>
timeout: 30
reward-commands:
- minecraft:xp add {player} {rand:80-220} points
- eco give {player} {rand:150-700}
messages:
  start: '

    <dark_gray>━━━━━━━━ <red><bold>REFLEJOS DE HERMES</bold></red> <dark_gray>━━━━━━━━

    <gray>¡El jugador mas rapido en reaccionar o hacer click se lleva el premio!</gray>


    {question}

    '
  win: '

    <green><bold>✓</bold> <yellow>{player}</yellow> demostro los mejores reflejos del Olimpo.</green>

    '
  timeout: '

    <red><bold>✗</bold> Hermes fue mas rapido. Nadie reacciono a tiempo.</red>

    '
variants:
- name: Código del Olimpo
  challenge: '<gold><bold>Escribe exactamente: <yellow>HERMES</yellow></bold></gold>'
  answer: HERMES
- name: Comando Tienda
  challenge: '<gold><bold>Comando de la tienda, SIN la barra: <yellow>shop</yellow></bold></gold>'
  answer: shop
- name: Comando Banco
  challenge: '<gold><bold>Comando del banco, SIN la barra: <yellow>bank</yellow></bold></gold>'
  answer: bank
- name: Comando Prote
  challenge: '<gold><bold>Comando para añadir en prote, SIN la barra: <yellow>ps add</yellow></bold></gold>'
  answer: ps add
- name: Velocidad TPS
  challenge: '<gold><bold>Escribe: <yellow>20 TPS SOLIDOS</yellow></bold></gold>'
  answer: 20 TPS SOLIDOS
- name: Slimefun
  challenge: '<gold><bold>Escribe: <yellow>SLIMEFUN 1.21</yellow></bold></gold>'
  answer: SLIMEFUN 1.21
- name: Rayo Olimpo
  challenge: '<gold><bold>Escribe: <yellow>RAYO DE ZEUS</yellow></bold></gold>'
  answer: RAYO DE ZEUS
- name: Click de Hermes
  challenge: <button hover='Hermes prueba tu velocidad' win><gold><bold>[ Haz click AQUÍ para ganar ]</bold></gold></button>
  answer: CLICK
- name: Trampa elemental
  challenge: '<yellow>Haz click ÚNICAMENTE en el rayo dorado.</yellow>


    <button>[<red><bold>FUEGO</bold></red>]</button>  <button win>[<gold><bold>⚡ RAYO</bold></gold>]</button>  <button>[<aqua><bold>AGUA</bold></aqua>]</button>'
  answer: CLICK
